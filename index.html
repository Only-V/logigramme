<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logigramme</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1016'/%3E%3Crect x='7' y='4' width='18' height='8' rx='2' fill='none' stroke='%238b8cf6' stroke-width='2'/%3E%3Cpath d='M16 12v5' stroke='%236b7280' stroke-width='2'/%3E%3Cpath d='M16 17l7 5.5-7 5.5-7-5.5z' fill='none' stroke='%238b8cf6' stroke-width='2'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#12161e">
<style>
:root{
  --bg:#0d1016; --panel:#12161e; --panel2:#1a1f29; --line:#252b37; --text:#e6e8ee; --muted:#9aa3b2; --dim:#6b7280; --accent:#8b8cf6;
  --mono:ui-monospace,"JetBrains Mono","Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;overflow:hidden}
#app{display:grid;grid-template-rows:50px 1fr;grid-template-columns:1fr 300px;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
header .ic+.lbl{margin-left:5px}
header.c1 .ic+.lbl{display:none}
header.c1 .group{padding-left:6px}
header.c2{gap:6px;padding:0 8px}
header.c2 button{padding:6px 8px}
header.c2 #docTitle{width:130px}
header.c2 .brand .logo{display:none}
.brand{display:flex;align-items:center;gap:8px;margin-right:6px;min-width:0}
.brand .logo{width:22px;height:22px;border:1.5px solid var(--accent);border-radius:5px;position:relative;flex:none}
.brand .logo::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border:1.5px solid var(--accent);transform:translate(-50%,-50%) rotate(45deg)}
#docTitle{background:transparent;border:1px solid transparent;color:var(--text);font:600 14px var(--sans);padding:5px 7px;border-radius:6px;width:210px}
#docTitle:hover,#docTitle:focus{border-color:var(--line);outline:none;background:var(--panel2)}
.group{display:flex;gap:4px;padding-left:10px;border-left:1px solid var(--line)}
.spacer{flex:1}
button{font:500 12.5px var(--sans);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#3a4252;background:#202633}
button.on{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#0d1016;font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:#f08b80}
button .k{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:5px}
#stage{position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(circle,#232a38 1px,transparent 1.3px)}
#canvas{width:100%;height:100%;display:block;touch-action:none}
#canvas text{user-select:none;-webkit-user-select:none}
#canvas .node{cursor:move}
#canvas .edge{cursor:pointer}
#canvas .port{cursor:crosshair}
#zoomInfo{position:absolute;left:12px;bottom:12px;font:600 11px var(--mono);color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
#hint{position:absolute;right:12px;bottom:12px;font:11px var(--mono);color:var(--dim);pointer-events:none}
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px}
aside h3{margin:0 0 14px;font:700 10.5px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
aside h4{margin:18px 0 8px;font:700 10px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.f{display:block;margin-bottom:12px}
.f>span{display:block;color:var(--muted);font-size:11.5px;margin-bottom:5px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px 9px;font:13px var(--sans)}
textarea{resize:vertical;min-height:38px;line-height:1.35}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatch{width:24px;height:24px;padding:0;border-radius:6px;background:var(--panel2);border:2px solid var(--c)}
.swatch.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.sw input[type=color]{width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--muted);line-height:1.5}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;color:var(--muted);font-size:12px}
.keys kbd{font:600 10.5px var(--mono);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 5px;white-space:nowrap;justify-self:start}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);color:var(--text);padding:9px 14px;border-radius:8px;font:12.5px var(--sans);transition:.2s;z-index:10}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-left-color:#e2786b}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:50px 1fr 40%}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="logo"></span><input id="docTitle" spellcheck="false" aria-label="Titre du logigramme"></div>
    <div class="group">
      <button data-act="add-box" title="Ajouter un bloc (B)"><span class="ic">▭</span><span class="lbl">Bloc</span></button>
      <button data-act="add-diamond" title="Ajouter une décision (D)"><span class="ic">◇</span><span class="lbl">Décision</span></button>
      <button data-act="add-pill" title="Ajouter une pastille (P)"><span class="ic">⬭</span><span class="lbl">Pastille</span></button>
      <button data-act="add-text" title="Ajouter un texte (T)"><span class="ic">T</span><span class="lbl">Texte</span></button>
    </div>
    <div class="group">
      <button data-act="undo" title="Annuler (Ctrl+Z)">↶</button>
      <button data-act="redo" title="Rétablir (Ctrl+Y)">↷</button>
      <button data-act="fit" title="Recadrer (F)"><span class="ic">⤢</span><span class="lbl">Recadrer</span></button>
      <button data-act="snap" id="snapBtn" title="Magnétisme de la grille (G)"><span class="ic">▦</span><span class="lbl">Grille</span></button>
    </div>
    <div class="spacer"></div>
    <button id="installBtn" title="Installer comme application de bureau" hidden><span class="ic">⬇</span><span class="lbl">Installer l'app</span></button>
    <div class="group">
      <button data-act="new">Nouveau</button>
      <button data-act="example">Exemple</button>
      <button data-act="open" title="Ouvrir un fichier .json">Ouvrir</button>
      <button data-act="save-json" title="Enregistrer en .json (Ctrl+S)">Enregistrer</button>
      <button data-act="export-svg">SVG</button>
      <button data-act="export-png" class="primary">Export PNG</button>
    </div>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </header>
  <main id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"><g id="vp"><g id="edgesL"></g><g id="nodesL"></g><g id="overL"></g></g></svg>
    <div id="zoomInfo" title="Revenir à 100 %">100 %</div>
    <div id="hint">glisser : déplacer · molette : zoom · Maj+glisser : sélection</div>
  </main>
  <aside id="panel"></aside>
</div>

<script>
(() => {
'use strict';

/* ---------- Constantes de style ---------- */
const SANS = "Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
const MONO = "ui-monospace, 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace";
const C = { bg:'#0d1016', fill:'#1a1e27', title:'#eceef3', sub:'#9aa3b2', edge:'#6b7280', accent:'#8b8cf6' };
const PALETTE = [
  ['Indigo','#8b8cf6'],['Corail','#e2786b'],['Turquoise','#3fc1c9'],['Vert','#6cc47f'],
  ['Ambre','#e3b35c'],['Violet','#b88cf3'],['Gris','#9aa3b2'],['Rose','#f07a9a']
];
const EDGE_PALETTE = [['Gris foncé', C.edge], ...PALETTE];
const F = {
  tag:`600 10px ${MONO}`, title:`700 14px ${SANS}`, sub:`400 12px ${SANS}`,
  dia:`700 13px ${SANS}`, pill:`700 11px ${MONO}`, text:`700 12px ${MONO}`
};
const DIR = { top:[0,-1], right:[1,0], bottom:[0,1], left:[-1,0] };
const OPP = { top:'bottom', bottom:'top', left:'right', right:'left' };
const PORTS = ['top','right','bottom','left'];
const PORT_FR = { top:'Haut', right:'Droite', bottom:'Bas', left:'Gauche' };
const TYPE_FR = { box:'Bloc', diamond:'Décision', pill:'Pastille', text:'Texte' };
const GRID = 10, STUB = 24, KEY = 'logigramme.v1';

/* ---------- État ---------- */
let doc = emptyDoc();
let view = { x:0, y:0, k:1 };
let sel = { nodes:new Set(), edge:null };
let hover = null, snap = true, drag = null, guides = [];
let undoS = [], redoS = [], clip = null, pendingSnap = null;

const $ = s => document.querySelector(s);
const svg = $('#canvas'), vp = $('#vp'), edgesL = $('#edgesL'), nodesL = $('#nodesL'), overL = $('#overL');
const stage = $('#stage'), panel = $('#panel'), titleIn = $('#docTitle');

function emptyDoc(){ return { title:'Mon logigramme', nodes:[], edges:[] }; }
const uid = p => p + Math.random().toString(36).slice(2, 9);
const byId = id => doc.nodes.find(n => n.id === id);
const edgeById = id => doc.edges.find(e => e.id === id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const r1 = v => Math.round(v * 10) / 10;
const snapV = v => snap ? Math.round(v / GRID) * GRID : v;
const lines = s => String(s ?? '').split('\n');

/* ---------- Mesure du texte ---------- */
const mctx = document.createElement('canvas').getContext('2d');
function tw(text, font, ls = 0){ mctx.font = font; return mctx.measureText(text).width + ls * text.length; }

function geom(n){
  if (n.type === 'box'){
    const T = lines(n.title), S = n.sub ? lines(n.sub) : [];
    let mw = n.tag ? tw(n.tag.toUpperCase(), F.tag, 1.2) : 0;
    T.forEach(l => mw = Math.max(mw, tw(l, F.title)));
    S.forEach(l => mw = Math.max(mw, tw(l, F.sub)));
    const w = n.w > 0 ? n.w : Math.max(160, Math.ceil(mw + 44));
    const h = 12 + (n.tag ? 16 : 0) + T.length * 19 + (S.length ? 2 + S.length * 16 : 0) + 11;
    return { w, h };
  }
  if (n.type === 'diamond'){
    const T = lines(n.title); let mw = 0;
    T.forEach(l => mw = Math.max(mw, tw(l, F.dia)));
    const th = T.length * 17;
    const w = n.w > 0 ? n.w : Math.max(120, Math.ceil(2 * mw + 28));
    const h = Math.max(n.w > 0 ? Math.round(w * 0.72) : 86, 2 * th + 30);
    return { w, h };
  }
  if (n.type === 'pill'){
    return { w: n.w > 0 ? n.w : Math.ceil(tw(n.title || '', F.pill) + 26), h: 22 };
  }
  const T = lines(n.title); let mw = 0;
  T.forEach(l => mw = Math.max(mw, tw(l, F.text)));
  return { w: Math.ceil(mw) + 6, h: T.length * 16 + 4 };
}

function portPt(n, g, p){
  switch (p){
    case 'top': return [n.x, n.y - g.h / 2];
    case 'bottom': return [n.x, n.y + g.h / 2];
    case 'left': return [n.x - g.w / 2, n.y];
    default: return [n.x + g.w / 2, n.y];
  }
}
function nearestPort(n, w){
  const g = geom(n); let best = 'top', bd = Infinity;
  for (const p of PORTS){ const q = portPt(n, g, p); const d = Math.hypot(q[0] - w[0], q[1] - w[1]); if (d < bd){ bd = d; best = p; } }
  return best;
}

/* ---------- Routage orthogonal ---------- */
// Tout est ramené à un repère où la sortie est verticale (transposition sinon).
function routeVV(P){
  const { a, b, da, db } = P;
  if (da[1] === -db[1] && (b[1] - a[1]) * da[1] > 0){
    const Y = P.oy ?? (a[1] + b[1]) / 2;
    return { pts:[a, [a[0], Y], [b[0], Y], b], handles:[{ i:1, key:'oy' }] };
  }
  if (da[1] === db[1]){
    const Y = P.oy ?? (da[1] > 0 ? Math.max(a[1], b[1]) + STUB : Math.min(a[1], b[1]) - STUB);
    return { pts:[a, [a[0], Y], [b[0], Y], b], handles:[{ i:1, key:'oy' }] };
  }
  const y1 = a[1] + da[1] * STUB, y2 = b[1] + db[1] * STUB;
  const X = P.ox ?? (Math.min(P.A.x - P.A.w / 2, P.B.x - P.B.w / 2) - 30);
  return { pts:[a, [a[0], y1], [X, y1], [X, y2], [b[0], y2], b], handles:[{ i:2, key:'ox' }] };
}
function routeVH(P){
  const { a, b, da, db } = P;
  const c = [a[0], b[1]];
  const ok = (c[1] - a[1]) * da[1] > 0 && (b[0] - c[0]) * (-db[0]) > 0;
  if (ok && P.oy == null && P.ox == null) return { pts:[a, c, b], handles:[] };
  const y1 = P.oy ?? a[1] + da[1] * STUB, x2 = P.ox ?? b[0] + db[0] * STUB;
  return { pts:[a, [a[0], y1], [x2, y1], [x2, b[1]], b], handles:[{ i:1, key:'oy' }, { i:2, key:'ox' }] };
}
function route(e){
  const A = byId(e.from), B = byId(e.to);
  if (!A || !B) return null;
  const ga = geom(A), gb = geom(B);
  const a = portPt(A, ga, e.fromPort), b = portPt(B, gb, e.toPort);
  const da = DIR[e.fromPort], db = DIR[e.toPort];
  const bA = { x:A.x, y:A.y, w:ga.w, h:ga.h }, bB = { x:B.x, y:B.y, w:gb.w, h:gb.h };
  const tr = da[0] !== 0;
  const T = p => [p[1], p[0]], TB = q => ({ x:q.y, y:q.x, w:q.h, h:q.w });
  const P = tr ? { a:T(a), b:T(b), da:T(da), db:T(db), A:TB(bA), B:TB(bB), oy:e.ox, ox:e.oy }
               : { a, b, da, db, A:bA, B:bB, oy:e.oy, ox:e.ox };
  const res = P.db[0] === 0 ? routeVV(P) : routeVH(P);
  if (tr){
    res.pts = res.pts.map(T);
    res.handles = res.handles.map(h => ({ ...h, key: h.key === 'oy' ? 'ox' : 'oy' }));
  }
  return res;
}
function simplify(p){
  const o = [];
  for (const q of p){ const l = o[o.length - 1]; if (l && Math.abs(l[0] - q[0]) < .01 && Math.abs(l[1] - q[1]) < .01) continue; o.push(q); }
  for (let i = o.length - 2; i > 0; i--){
    const a = o[i - 1], b = o[i], c = o[i + 1];
    if ((Math.abs(a[0] - b[0]) < .01 && Math.abs(b[0] - c[0]) < .01) || (Math.abs(a[1] - b[1]) < .01 && Math.abs(b[1] - c[1]) < .01)) o.splice(i, 1);
  }
  return o;
}
function pointAt(pts, f){
  let total = 0; const seg = [];
  for (let i = 0; i < pts.length - 1; i++){ const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(l); total += l; }
  let t = total * f;
  for (let i = 0; i < seg.length; i++){
    if (t <= seg[i] || i === seg.length - 1){ const k = seg[i] ? Math.min(1, t / seg[i]) : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]; }
    t -= seg[i];
  }
  return pts[0];
}

/* ---------- Rendu SVG ---------- */
function txt(x, y, s, font, size, weight, fill, extra = ''){
  return `<text x="${r1(x)}" y="${r1(y)}" text-anchor="middle" font-family="${font}" font-size="${size}" font-weight="${weight}" fill="${fill}"${extra}>${esc(s)}</text>`;
}
function nodeSVG(n, ui = true){
  const g = geom(n), x0 = n.x - g.w / 2, y0 = n.y - g.h / 2;
  const col = n.color || PALETTE[0][1];
  const dash = n.dashed ? ' stroke-dasharray="6 4"' : '';
  let s = ui ? `<g class="node" data-id="${n.id}">` : '<g>';
  if (n.type === 'box'){
    s += `<rect x="${r1(x0)}" y="${r1(y0)}" width="${g.w}" height="${g.h}" rx="9" fill="${C.fill}" stroke="${col}" stroke-width="1.5"${dash}/>`;
    let y = y0 + 12;
    if (n.tag){ s += txt(n.x, y + 10, n.tag.toUpperCase(), MONO, 10, 600, col, ' letter-spacing="1.2"'); y += 16; }
    lines(n.title).forEach(l => { s += txt(n.x, y + 14, l, SANS, 14, 700, C.title); y += 19; });
    if (n.sub){ y += 2; lines(n.sub).forEach(l => { s += txt(n.x, y + 12, l, SANS, 12, 400, C.sub); y += 16; }); }
  } else if (n.type === 'diamond'){
    const pts = `${r1(n.x)},${r1(y0)} ${r1(x0 + g.w)},${r1(n.y)} ${r1(n.x)},${r1(y0 + g.h)} ${r1(x0)},${r1(n.y)}`;
    s += `<polygon points="${pts}" fill="${C.fill}" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"${dash}/>`;
    const T = lines(n.title); let y = n.y - T.length * 17 / 2 + 12.5;
    T.forEach(l => { s += txt(n.x, y, l, SANS, 13, 700, C.title); y += 17; });
  } else if (n.type === 'pill'){
    s += `<rect x="${r1(x0)}" y="${r1(y0)}" width="${g.w}" height="${g.h}" rx="${g.h / 2}" fill="${C.fill}" stroke="${col}" stroke-width="1.4"${dash}/>`;
    s += txt(n.x, n.y + 4, n.title || '', MONO, 11, 700, col);
  } else {
    if (ui) s += `<rect x="${r1(x0)}" y="${r1(y0)}" width="${g.w}" height="${g.h}" fill="transparent"/>`;
    const T = lines(n.title); let y = y0 + 14;
    T.forEach(l => { s += txt(n.x, y, l, MONO, 12, 700, col); y += 16; });
  }
  return s + '</g>';
}
function edgeSVG(e, ui = true){
  const r = route(e); if (!r) return '';
  const pts = simplify(r.pts); if (pts.length < 2) return '';
  const col = e.color || C.edge, arrow = e.arrow !== false, isSel = ui && sel.edge === e.id;
  const n = pts.length, end = pts[n - 1], pre = pts[n - 2];
  const L = Math.hypot(end[0] - pre[0], end[1] - pre[1]) || 1, ux = (end[0] - pre[0]) / L, uy = (end[1] - pre[1]) / L;
  const AL = 8, AW = 4.5, dp = pts.slice();
  if (arrow && L > AL) dp[n - 1] = [end[0] - ux * AL, end[1] - uy * AL];
  const d = 'M' + dp.map(p => r1(p[0]) + ' ' + r1(p[1])).join(' L');
  let s = ui ? `<g class="edge" data-id="${e.id}">` : '<g>';
  if (ui) s += `<path d="${d}" fill="none" stroke="transparent" stroke-width="14"/>`;
  if (isSel) s += `<path d="${d}" fill="none" stroke="${C.accent}" stroke-opacity=".35" stroke-width="6" stroke-linejoin="round"/>`;
  s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"${e.dashed ? ' stroke-dasharray="5 4"' : ''}/>`;
  if (arrow){
    const bx = end[0] - ux * AL, by = end[1] - uy * AL;
    s += `<polygon points="${r1(end[0])},${r1(end[1])} ${r1(bx - uy * AW)},${r1(by + ux * AW)} ${r1(bx + uy * AW)},${r1(by - ux * AW)}" fill="${col}"/>`;
  }
  if (e.label){
    const [lx, ly] = pointAt(pts, e.labelPos ?? 0.5);
    const lc = e.labelColor || (e.color && e.color !== C.edge ? e.color : C.sub);
    const w = Math.ceil(tw(e.label, F.pill) + 22), h = 20;
    s += `<rect x="${r1(lx - w / 2)}" y="${r1(ly - h / 2)}" width="${w}" height="${h}" rx="10" fill="${C.fill}" stroke="${lc}" stroke-width="1.3"/>`;
    s += txt(lx, ly + 4, e.label, MONO, 11, 700, lc);
  }
  return s + '</g>';
}
function overlaySVG(){
  let s = '';
  for (const id of sel.nodes){

/* ---------- Historique & sauvegarde ---------- */
const snapshot = () => JSON.stringify(doc);

/* ---------- Actions sur le modèle ---------- */

  if (type === 'diamond') n.title = 'Condition ?';

function viewCenter(){ return [(stage.clientWidth / 2 - view.x) / view.k, (stage.clientHeight / 2 - view.y) / view.k]; }

    doc.nodes = doc.nodes.filter(n => !sel.nodes.has(n.id));

}
function copySel(){
  if (!sel.nodes.size) return;

    nodes: doc.nodes.filter(n => sel.nodes.has(n.id)).map(n => ({ ...n })),
    edges: doc.edges.filter(e => sel.nodes.has(e.from) && sel.nodes.has(e.to)).map(e => ({ ...e }))

/* ---------- Export ---------- */
function bounds(){
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  const add = (x, y) => { x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x); y2 = Math.max(y2, y); };
  doc.nodes.forEach(n => { const g = geom(n); add(n.x - g.w / 2, n.y - g.h / 2); add(n.x + g.w / 2, n.y + g.h / 2); });
  doc.edges.forEach(e => { const r = route(e); if (r) r.pts.forEach(p => add(p[0], p[1])); });

}
function buildSVG(){
  const b = bounds(), P = 40;
  const W = Math.ceil(b.x2 - b.x1 + 2 * P), H = Math.ceil(b.y2 - b.y1 + 2 * P), ox = Math.floor(b.x1 - P), oy = Math.floor(b.y1 - P);
  const str = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${ox} ${oy} ${W} ${H}"><rect x="${ox}" y="${oy}" width="${W}" height="${H}" fill="${C.bg}"/>${doc.edges.map(e => edgeSVG(e, false)).join('')}${doc.nodes.map(n => nodeSVG(n, false)).join('')}</svg>`;

}
function fileName(){ return (doc.title || 'logigramme').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'logigramme'; }
function download(name, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportSVG(){
  if (!doc.nodes.length) return;
  const str = buildSVG().str;
  if (DESKTOP) return invoke('save_text', { path:null, defaultName:fileName() + '.svg', ext:'svg', content:str })
    .then(p => p && toast('Exporté : ' + baseName(p))).catch(err => toast('Export impossible : ' + err, true));
  download(fileName() + '.svg', new Blob([str], { type:'image/svg+xml' }));
}
function exportPNG(){
  if (!doc.nodes.length) return;

  img.onload = () => {

        .then(p => p && toast('Exporté : ' + baseName(p))).catch(err => toast('Export impossible : ' + err, true));

function exportJSON(saveAs = false){

function loadDoc(d){

/* ---------- Vue ---------- */
function fit(){

  const b = bounds(), P = 50;
  view.k = Math.max(.2, Math.min((W - 2 * P) / Math.max(1, b.x2 - b.x1), (H - 2 * P) / Math.max(1, b.y2 - b.y1), 1.25));

    const [dx, dy] = { ArrowUp:[0, -s], ArrowDown:[0, s], ArrowLeft:[-s, 0], ArrowRight:[s, 0] }[ev.key];
    sel.nodes.forEach(id => { const n = byId(id); n.x += dx; n.y += dy; }); renderAll(); return;
  }
  if (ev.key === 'Enter' && (sel.nodes.size === 1 || sel.edge)){ ev.preventDefault(); focusField(sel.edge ? 'label' : 'title'); return; }
  const map = { b:'box', d:'diamond', p:'pill', t:'text' };
  if (map[k]){ ev.preventDefault(); addNode(map[k]); }
  else if (k === 'f') fit();
  else if (k === 'g'){ snap = !snap; render(); }
});

/* ---------- Panneau latéral ---------- */
function swatches(field, val, pal = PALETTE){
  const v = (val || '').toLowerCase();
  return `<div class="sw">${pal.map(([nm, c]) => `<button type="button" class="swatch${c.toLowerCase() === v ? ' on' : ''}" data-f="${field}" data-v="${c}" title="${nm}" style="--c:${c}"></button>`).join('')}<input type="color" data-f="${field}" value="${esc(val || '#8b8cf6')}" title="Couleur personnalisée"></div>`;
}
const field = (label, inner) => `<label class="f"><span>${label}</span>${inner}</label>`;
const chk = (f, on, label) => `<label class="chk"><input type="checkbox" data-f="${f}"${on ? ' checked' : ''}>${label}</label>`;
const portSel = (f, v) => `<select data-f="${f}">${PORTS.map(p => `<option value="${p}"${p === v ? ' selected' : ''}>${PORT_FR[p]}</option>`).join('')}</select>`;

function nodePanel(n){
  let h = `<h3>${TYPE_FR[n.type]}</h3>`;
  h += field('Type', `<select data-f="type">${Object.keys(TYPE_FR).map(t => `<option value="${t}"${t === n.type ? ' selected' : ''}>${TYPE_FR[t]}</option>`).join('')}</select>`);
  if (n.type === 'box'){
    h += field('Étiquette (en capitales)', `<input type="text" data-f="tag" value="${esc(n.tag)}" placeholder="ex. SHAREPOINT">`);
    h += field('Titre', `<textarea data-f="title" rows="1">${esc(n.title)}</textarea>`);
    h += field('Sous-titre', `<textarea data-f="sub" rows="1">${esc(n.sub)}</textarea>`);
  } else {
    h += field('Texte', `<textarea data-f="title" rows="${n.type === 'diamond' ? 2 : 1}">${esc(n.title)}</textarea>`);
  }
  h += `<h4>Couleur</h4>` + swatches('color', n.color);
  h += `<h4>Forme</h4>`;
  if (n.type !== 'text'){
    h += chk('dashed', n.dashed, 'Bordure pointillée');
    h += field('Largeur (0 = auto)', `<input type="number" min="0" step="10" data-f="w" value="${n.w || 0}">`);
  }
  h += `<div class="row"><button data-act="duplicate">Dupliquer</button><button data-act="delete" class="danger">Supprimer</button></div>`;
  h += `<p class="muted" style="margin-top:16px">Survolez le bloc puis glissez un point pour créer une liaison. Lâchez dans le vide pour créer un nouveau bloc relié.</p>`;
  return h;
}
function edgePanel(e){
  let h = `<h3>Liaison</h3>`;
  h += field('Libellé', `<input type="text" data-f="label" value="${esc(e.label)}" placeholder="ex. Oui, Non, 3…">`);
  h += `<h4>Couleur du libellé</h4>` + swatches('labelColor', e.labelColor);
  h += `<h4>Trait</h4>` + swatches('color', e.color || C.edge, EDGE_PALETTE);
  h += `<div style="height:10px"></div>` + chk('dashed', e.dashed, 'Trait pointillé') + chk('arrow', e.arrow !== false, 'Flèche à l\'arrivée');
  h += field('Position du libellé', `<input type="range" min="0.05" max="0.95" step="0.01" data-f="labelPos" value="${e.labelPos ?? 0.5}">`);
  h += `<div class="row2">${field('Départ', portSel('fromPort', e.fromPort))}${field('Arrivée', portSel('toPort', e.toPort))}</div>`;
  h += `<div class="row"><button data-act="reverse">Inverser</button><button data-act="reset-route">Tracé auto</button><button data-act="delete" class="danger">Supprimer</button></div>`;
  h += `<p class="muted" style="margin-top:16px">Glissez les poignées carrées sur le trait pour décaler un segment (pratique pour les boucles de retour).</p>`;
  return h;
}
function multiPanel(){
  const first = byId([...sel.nodes][0]);
  let h = `<h3>${sel.nodes.size} éléments</h3>`;
  h += `<h4>Couleur</h4>` + swatches('color', first && first.color);
  h += `<h4>Alignement</h4><div class="row"><button data-act="align-x" title="Même axe vertical que le premier sélectionné">Centrer en colonne</button><button data-act="align-y" title="Même ligne que le premier sélectionné">Centrer en ligne</button></div>`;
  h += `<div class="row"><button data-act="dist-y">Répartir verticalement</button><button data-act="dist-x">Répartir horizontalement</button></div>`;
  h += `<h4>Actions</h4><div class="row"><button data-act="duplicate">Dupliquer</button><button data-act="delete" class="danger">Supprimer</button></div>`;
  return h;
}
function docPanel(){
  return `<h3>Logigramme</h3>
  <p class="muted">${doc.nodes.length} blocs · ${doc.edges.length} liaisons. ${DESKTOP
    ? (filePath ? `Fichier : <b>${esc(baseName(filePath))}</b>. Ctrl+S enregistre dedans, Ctrl+Maj+S pour un autre fichier.` : 'Session sauvegardée automatiquement sur le disque. <b>Enregistrer</b> crée un fichier .json.')
    : 'Sauvegarde automatique dans ce navigateur. Utilisez <b>Enregistrer</b> pour garder un fichier .json.'}</p>
  <h4>Créer</h4>
  <div class="keys">
    <kbd>B</kbd><span>Bloc (sous le bloc sélectionné, relié)</span>
    <kbd>D</kbd><span>Décision</span>
    <kbd>P</kbd><span>Pastille</span>
    <kbd>T</kbd><span>Texte libre</span>
    <kbd>Double-clic</kbd><span>Bloc à cet endroit</span>
  </div>
  <h4>Éditer</h4>
  <div class="keys">
    <kbd>Entrée</kbd><span>Modifier le texte</span>
    <kbd>Suppr</kbd><span>Supprimer</span>
    <kbd>Ctrl+D</kbd><span>Dupliquer</span>
    <kbd>Ctrl+C / V</kbd><span>Copier / coller</span>
    <kbd>Ctrl+Z / Y</kbd><span>Annuler / rétablir</span>
    <kbd>Ctrl+S / O</kbd><span>Enregistrer / ouvrir</span>
    <kbd>Flèches</kbd><span>Déplacer (Maj : x2)</span>
    <kbd>Maj+clic</kbd><span>Sélection multiple</span>
  </div>
  <h4>Vue</h4>
  <div class="keys">
    <kbd>F</kbd><span>Recadrer</span>
    <kbd>G</kbd><span>Magnétisme grille</span>
    <kbd>Molette</kbd><span>Zoom</span>
  </div>`;
}
function renderPanel(){
  if (sel.edge && edgeById(sel.edge)) panel.innerHTML = edgePanel(edgeById(sel.edge));
  else if (sel.nodes.size === 1) panel.innerHTML = nodePanel(byId([...sel.nodes][0]));
  else if (sel.nodes.size > 1) panel.innerHTML = multiPanel();
  else panel.innerHTML = docPanel();
  panel.querySelectorAll('textarea').forEach(autoGrow);
}
function autoGrow(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }
function focusField(f){
  const el = panel.querySelector(`[data-f="${f}"]`);
  if (el){ el.focus(); if (el.select) el.select(); }
}
function valOf(el){
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'number' || el.type === 'range') return parseFloat(el.value) || 0;
  return el.value;
}
panel.addEventListener('focusin', ev => { if (ev.target.matches('input,textarea,select')) pendingSnap = snapshot(); });
panel.addEventListener('input', ev => {
  const el = ev.target, f = el.dataset.f; if (!f) return;
  if (pendingSnap){ undoS.push(pendingSnap); redoS = []; pendingSnap = null; }
  setField(f, valOf(el));
  if (el.tagName === 'TEXTAREA') autoGrow(el);
  render();
  if (f === 'type' || el.type === 'color') renderPanel();
});
panel.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-f]'); if (!b) return;
  checkpoint(); setField(b.dataset.f, b.dataset.v); renderAll();
});

/* ---------- Boutons ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-act]'); if (!b) return;
  const a = b.dataset.act;
  switch (a){
    case 'add-box': addNode('box'); break;
    case 'add-diamond': addNode('diamond'); break;
    case 'add-pill': addNode('pill'); break;
    case 'add-text': addNode('text'); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'fit': fit(); break;
    case 'snap': snap = !snap; render(); break;
    case 'new': if (confirm('Effacer le logigramme en cours ? (Ctrl+Z pour revenir en arrière)')){ checkpoint(); doc = emptyDoc(); filePath = null; sel.nodes.clear(); sel.edge = null; renderAll(); fit(); } break;
    case 'example': loadDoc(exampleDoc()); filePath = null; save(); break;
    case 'open': openFile(); break;
    case 'save-json': exportJSON(); break;
    case 'export-svg': exportSVG(); break;
    case 'export-png': exportPNG(); break;
    case 'delete': deleteSel(); break;
    case 'duplicate': duplicate(); break;
    case 'align-x': align('x'); break;
    case 'align-y': align('y'); break;
    case 'dist-x': distribute('x'); break;
    case 'dist-y': distribute('y'); break;
    case 'reverse': {
      const e = edgeById(sel.edge); if (!e) break; checkpoint();
      [e.from, e.to] = [e.to, e.from]; [e.fromPort, e.toPort] = [e.toPort, e.fromPort]; renderAll(); break;
    }
    case 'reset-route': {
      const e = edgeById(sel.edge); if (!e) break; checkpoint(); delete e.ox; delete e.oy; renderAll(); break;
    }
  }
});
$('#fileIn').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  f.text().then(t => { try { loadDoc(JSON.parse(t)); } catch (_) { alert('Fichier invalide : un .json exporté par cette app est attendu.'); } });
  ev.target.value = '';
});
titleIn.addEventListener('input', () => { doc.title = titleIn.value; save(); });
titleIn.addEventListener('keydown', ev => { if (ev.key === 'Enter') titleIn.blur(); });

/* ---------- Exemple ---------- */

      E('e10', 'n7', 'bottom', 'n8', 'top'),
      E('e11', 'n8', 'bottom', 'd1', 'left', { color:I, dashed:true, oy:960, ox:110 }),

      E('e13', 'p1', 'bottom', 'n10', 'top'),
      E('e14', 'n10', 'right', 'n11', 'left', { color:R, dashed:true })

/* ---------- Démarrage ---------- */
// Première ouverture : page vierge. Ensuite : dernier logigramme en cours.
function restore(raw){
  try {
    const s = JSON.parse(raw || 'null');
    if (s && s.doc && Array.isArray(s.doc.nodes)){
      doc = s.doc; if (s.view) view = s.view; if (typeof s.snap === 'boolean') snap = s.snap;
      filePath = s.filePath || null; lastSaved = raw; return true;
    }
  } catch (_) {}
  return false;
}
async function start(){
  let raw = null;
  if (DESKTOP){ try { raw = await invoke('load_session'); } catch (err) { toast('Session illisible : ' + err, true); } }
  else { try { raw = localStorage.getItem(KEY); } catch (_) {} }
  const restored = restore(raw);
  ready = true;
  renderAll();
  if (!restored) requestAnimationFrame(fit);
}
start();

/* ---------- Barre adaptative ---------- */
const header = document.querySelector('header');
function fitHeader(){
  header.classList.remove('c1', 'c2');
  if (header.scrollWidth > header.clientWidth) header.classList.add('c1');
  if (header.scrollWidth > header.clientWidth) header.classList.add('c2');
}
window.addEventListener('resize', fitHeader);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHeader);
fitHeader();

/* ---------- Application installable ---------- */
if (DESKTOP){ document.body.classList.add('desktop'); }
else if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
let installEvt = null;
const installBtn = $('#installBtn');
window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); installEvt = ev; installBtn.hidden = false; fitHeader(); });
installBtn.addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice.catch(() => {});
  installEvt = null; installBtn.hidden = true; fitHeader();
});
window.addEventListener('appinstalled', () => { installBtn.hidden = true; fitHeader(); });
})();
</script>
